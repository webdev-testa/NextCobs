<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="fleetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181310"/>
      <stop offset="100%" stop-color="#241a15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#fleetBg)"/>

  <!-- Top Navigation -->
  <rect x="0" y="0" width="1200" height="64" fill="#120e0b"/>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#3b2b22" stroke-width="1"/>

  <circle cx="44" cy="32" r="14" fill="#f97316"/>
  <text x="44" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🚚</text>
  <text x="72" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Fleet Metrics • OCR Receipt &amp; Mileage Scanner</text>

  <rect x="980" y="18" width="180" height="28" rx="14" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.4"/>
  <text x="1070" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">⚡ 94% Extraction Rate</text>

  <!-- Left: Scanned Physical Receipt with OCR bounding boxes -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="520" height="610" rx="16" fill="#1c1613" stroke="#3d2c23"/>
    <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Raw Driver Receipt Ingestion</text>
    <text x="32" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Deskewing, Contrast Normalization &amp; Polygon Detection</text>

    <!-- Receipt paper surface -->
    <g transform="translate(40, 85)">
      <rect x="0" y="0" width="440" height="490" rx="10" fill="#fdfcf8" stroke="#d5cebd"/>
      
      <!-- Receipt print -->
      <text x="220" y="40" font-family="monospace" font-size="14" font-weight="bold" fill="#1c1917" text-anchor="middle">SPBU PERTAMINA 31.127.02</text>
      <text x="220" y="60" font-family="monospace" font-size="10" fill="#78716c" text-anchor="middle">Jl. Gatot Subroto Kav. 35, Jakarta</text>
      <line x1="20" y1="75" x2="420" y2="75" stroke="#e7e5e4" stroke-dasharray="4"/>

      <!-- Bounding Box: Date -->
      <rect x="20" y="90" width="200" height="26" rx="4" fill="#f97316" fill-opacity="0.1" stroke="#f97316" stroke-width="1.5"/>
      <text x="26" y="108" font-family="monospace" font-size="12" fill="#1c1917">DATE: 14/08/2025 09:42</text>
      <text x="230" y="108" font-family="monospace" font-size="9" font-weight="bold" fill="#ea580c">OCR: 0.98</text>

      <!-- Bounding Box: Vehicle Number -->
      <rect x="20" y="130" width="230" height="26" rx="4" fill="#f97316" fill-opacity="0.1" stroke="#f97316" stroke-width="1.5"/>
      <text x="26" y="148" font-family="monospace" font-size="12" fill="#1c1917">VEHICLE: B 9421 UXR (Van 04)</text>
      <text x="260" y="148" font-family="monospace" font-size="9" font-weight="bold" fill="#ea580c">OCR: 0.99</text>

      <!-- Bounding Box: Fuel Type -->
      <rect x="20" y="170" width="280" height="26" rx="4" fill="#f97316" fill-opacity="0.1" stroke="#f97316" stroke-width="1.5"/>
      <text x="26" y="188" font-family="monospace" font-size="12" fill="#1c1917">PRODUCT: DEXLITE (DIESEL)</text>

      <!-- Bounding Box: Liters -->
      <rect x="20" y="210" width="180" height="26" rx="4" fill="#f97316" fill-opacity="0.1" stroke="#f97316" stroke-width="1.5"/>
      <text x="26" y="228" font-family="monospace" font-size="12" fill="#1c1917">VOLUME: 42.50 LTR</text>
      <text x="210" y="228" font-family="monospace" font-size="9" font-weight="bold" fill="#ea580c">OCR: 0.99</text>

      <!-- Bounding Box: Price -->
      <rect x="20" y="250" width="220" height="34" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2"/>
      <text x="26" y="273" font-family="monospace" font-size="15" font-weight="bold" fill="#047857">TOTAL: Rp 641.750</text>
      <text x="250" y="273" font-family="monospace" font-size="9" font-weight="bold" fill="#059669">CONFIRMED</text>

      <line x1="20" y1="310" x2="420" y2="310" stroke="#e7e5e4" stroke-dasharray="4"/>

      <!-- Odometer Snapshot inset -->
      <g transform="translate(20, 330)">
        <rect x="0" y="0" width="400" height="120" rx="8" fill="#1c1917"/>
        <text x="16" y="28" font-family="monospace" font-size="11" fill="#ea580c">DASHBOARD ODOMETER READING PHOTO</text>
        <!-- Digital Digits -->
        <rect x="16" y="44" width="160" height="48" rx="6" fill="#0c0a09" stroke="#44403c"/>
        <text x="96" y="78" font-family="monospace" font-size="24" font-weight="bold" fill="#22c55e" text-anchor="middle">048219</text>
        <text x="185" y="62" font-family="monospace" font-size="11" fill="#a8a29e">km recorded</text>
        <text x="185" y="82" font-family="monospace" font-size="11" fill="#22c55e">✓ Delta: +184 km verified</text>
      </g>
    </g>
  </g>

  <!-- Right: Structured Ledger Output -->
  <g transform="translate(590, 90)">
    <rect x="0" y="0" width="570" height="610" rx="16" fill="#1c1613" stroke="#3d2c23"/>
    <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Structured Fleet Ledger JSON</text>
    <text x="32" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Validated against vehicle fuel consumption baseline</text>

    <!-- JSON Terminal Window -->
    <g transform="translate(24, 90)">
      <rect x="0" y="0" width="522" height="490" rx="10" fill="#0e0a08" stroke="#2b1e17"/>
      <text x="24" y="36" font-family="monospace" font-size="12" fill="#78716c">// Automatically parsed &amp; verified payload</text>
      
      <text x="24" y="70" font-family="monospace" font-size="12" fill="#ea580c">"transaction_id"</text>
      <text x="180" y="70" font-family="monospace" font-size="12" fill="#f8fafc">: "TX-20250814-0482",</text>

      <text x="24" y="100" font-family="monospace" font-size="12" fill="#ea580c">"vehicle"</text>
      <text x="180" y="100" font-family="monospace" font-size="12" fill="#f8fafc">: "B 9421 UXR",</text>

      <text x="24" y="130" font-family="monospace" font-size="12" fill="#ea580c">"fuel_liters"</text>
      <text x="180" y="130" font-family="monospace" font-size="12" fill="#38bdf8">: 42.50,</text>

      <text x="24" y="160" font-family="monospace" font-size="12" fill="#ea580c">"cost_idr"</text>
      <text x="180" y="160" font-family="monospace" font-size="12" fill="#34d399">: 641750,</text>

      <text x="24" y="190" font-family="monospace" font-size="12" fill="#ea580c">"odometer_km"</text>
      <text x="180" y="190" font-family="monospace" font-size="12" fill="#38bdf8">: 48219,</text>

      <text x="24" y="220" font-family="monospace" font-size="12" fill="#ea580c">"km_per_liter"</text>
      <text x="180" y="220" font-family="monospace" font-size="12" fill="#34d399">: 4.33 <tspan fill="#78716c">(Normal Range)</tspan>,</text>

      <text x="24" y="250" font-family="monospace" font-size="12" fill="#ea580c">"anomaly_detected"</text>
      <text x="180" y="250" font-family="monospace" font-size="12" fill="#22c55e">: false,</text>

      <text x="24" y="280" font-family="monospace" font-size="12" fill="#ea580c">"accounting_status"</text>
      <text x="180" y="280" font-family="monospace" font-size="12" fill="#38bdf8">: "AUTO_APPROVED"</text>

      <!-- Export Buttons -->
      <g transform="translate(24, 340)">
        <rect x="0" y="0" width="220" height="42" rx="8" fill="#f97316"/>
        <text x="110" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Export to Accounting ERP</text>

        <rect x="236" y="0" width="220" height="42" rx="8" fill="#292524" stroke="#44403c"/>
        <text x="346" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#f5f5f4" text-anchor="middle">Download Audited PDF</text>
      </g>
    </g>
  </g>
</svg>
