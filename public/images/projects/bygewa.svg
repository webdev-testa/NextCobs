      <text x="180" y="140" font-family="monospace" font-size="11" fill="#94a3b8">Sunflowers</text>
      <text x="310" y="140" font-family="monospace" font-size="11" fill="#94a3b8">2.1 km</text>
      <text x="390" y="140" font-family="monospace" font-size="11" fill="#64748b">SENT</text>

