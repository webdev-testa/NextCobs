<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Top App Navigation Bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#0b1120" />
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#334155" stroke-width="1"/>
  
  <!-- Logo & Title -->
  <circle cx="44" cy="32" r="14" fill="#10b981"/>
  <text x="44" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">LG</text>
  <text x="72" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Sinar Mas • AI Knowledge Hub</text>

  <!-- Status Chip -->
  <rect x="1030" y="20" width="130" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3"/>
  <circle cx="1046" cy="33" r="4" fill="#10b981"/>
  <text x="1058" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399">pgvector active</text>

  <!-- Main Grid: Sidebar + Chat Stream -->
  <!-- Sidebar -->
  <rect x="0" y="64" width="280" height="686" fill="#0f172a"/>
  <line x1="280" y1="64" x2="280" y2="750" stroke="#334155" stroke-width="1"/>

  <text x="24" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">INDEXED DOCUMENTS</text>

  <!-- Doc Item 1 -->
  <rect x="16" y="125" width="248" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="32" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">HR Policies &amp; Benefits 2025</text>
  <text x="32" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">24 pages • 82 vector chunks</text>

  <!-- Doc Item 2 -->
  <rect x="16" y="189" width="248" height="54" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="32" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">IT Security &amp; Access Controls</text>
  <text x="32" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">16 pages • 45 vector chunks</text>

  <!-- Doc Item 3 -->
  <rect x="16" y="253" width="248" height="54" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="32" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Travel &amp; Expense Guidelines</text>
  <text x="32" y="293" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">12 pages • 31 vector chunks</text>

  <!-- Chat Content Area -->
  <!-- Search Bar / Input at Top -->
  <rect x="320" y="100" width="840" height="52" rx="12" fill="#1e293b" stroke="#334155"/>
  <circle cx="348" cy="126" r="6" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <line x1="353" y1="131" x2="360" y2="138" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <text x="375" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#f8fafc">How many days of paid parental leave are engineers entitled to?</text>
  <rect x="1100" y="112" width="48" height="28" rx="6" fill="#10b981"/>
  <text x="1124" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">→</text>

  <!-- User Query Bubble -->
  <rect x="680" y="180" width="480" height="54" rx="14" fill="#334155"/>
  <text x="704" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#ffffff">How many days of paid parental leave are engineers entitled to?</text>

  <!-- AI Verified Response Card -->
  <rect x="320" y="254" width="840" height="290" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  
  <!-- Verified Header -->
  <rect x="320" y="254" width="840" height="46" rx="16" fill="#10b981" fill-opacity="0.1"/>
  <circle cx="348" cy="277" r="7" fill="#10b981"/>
  <path d="M344 277 L347 280 L352 274" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="364" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">Verified Answer • Cited from Official HR Handbook</text>
  <text x="1136" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="end">Latency: 1.2s</text>

  <!-- Answer Text -->
  <text x="350" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#f8fafc" font-weight="500">According to the 2025 Corporate Handbook (§4.2, Maternal &amp; Parental Leave):</text>
  <text x="350" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#cbd5e1" font-weight="400">• Full-time engineers receive <tspan fill="#34d399" font-weight="bold">90 calendar days</tspan> of fully paid maternal leave.</text>
  <text x="350" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#cbd5e1" font-weight="400">• Secondary caregivers are eligible for <tspan fill="#34d399" font-weight="bold">14 consecutive calendar days</tspan> of paid paternity leave.</text>
  <text x="350" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#cbd5e1" font-weight="400">• Engineering project handover checklist must be signed off 3 weeks prior.</text>

  <!-- Citation Pill -->
  <rect x="350" y="456" width="380" height="38" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="368" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">📄 <tspan fill="#38bdf8" font-weight="600">HR-POL-2025.pdf</tspan> • Page 14, Paragraph 2</text>
  
  <rect x="744" y="456" width="160" height="38" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="760" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">Similarity Score: 0.99</text>

  <!-- Architecture Flow Banner at bottom -->
  <rect x="320" y="570" width="840" height="60" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="344" y="605" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">OCR Parser</text>
  <text x="440" y="605" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">→</text>
  <text x="470" y="605" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Recursive Chunking</text>
  <text x="610" y="605" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">→</text>
  <text x="640" y="605" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a855f7">PostgreSQL pgvector</text>
  <text x="795" y="605" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">→</text>
  <text x="825" y="605" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">Cited LLM Generation</text>
</svg>
